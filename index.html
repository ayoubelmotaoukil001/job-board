<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stages & Alternances — Catalogue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-full flex flex-col justify-between text-gray-900 bg-gray-50 antialiased font-['Inter']">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-lg text-gray-900">Stages & Alternances</a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="index.html" class="text-gray-900 border-b-2 border-gray-900 pb-0.5">Offres</a>
        <a href="offres-suivies.html" class="text-gray-600 hover:text-gray-900">Offres Suivies</a>
        <a href="deposer-offre.html" class="text-gray-600 hover:text-gray-900">Publier une offre</a>
      </nav>
      <a href="admin.html" class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm">Espace Admin</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-6">

    <!-- Hero -->
    <div class="text-center py-4 space-y-2">
      <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 tracking-tight">Trouvez votre Stage ou Alternance</h1>
      <p class="text-gray-600 text-sm md:text-base max-w-xl mx-auto">Consultez et filtrez les meilleures opportunités en développement web.</p>
    </div>

    <!-- Filters -->
    <!-- Filters -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm grid grid-cols-1 md:grid-cols-12 gap-3">
      <input id="search-input" type="text" placeholder="Mots-clés (React, TechCorp...)" class="md:col-span-5 px-3.5 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:bg-white">
      <select id="contract-filter" class="md:col-span-3 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:bg-white">
        <option value="all">Tous les contrats</option>
        <option value="stage">Stage</option>
        <option value="alternance">Alternance</option>
      </select>
      <select id="city-filter" class="md:col-span-2 px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:bg-white">
        <option value="">Toutes les villes</option>
        <option value="casablanca">Casablanca</option>
        <option value="rabat">Rabat</option>
        <option value="tanger">Tanger</option>
      </select>
      <button type="button" class="md:col-span-2 bg-gray-900 text-white text-sm font-medium py-2 px-4 rounded-lg hover:bg-gray-800">Filtrer</button>
    </div>

    <!-- Results Header -->
    <div class="flex items-center justify-between pt-2">
      <p class="text-sm font-semibold text-gray-700"><span id="offer-count" class="text-gray-900 font-bold">0</span> opportunités trouvées</p>
    </div>

    <!-- Job Cards Grid -->
    <div id="offers-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-12">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <p>© 2026 Stages & Alternances</p>
      <div class="flex gap-4">
        <a href="index.html" class="hover:text-gray-900">Catalogue</a>
        <a href="offres-suivies.html" class="hover:text-gray-900">Offres suivies</a>
        <a href="deposer-offre.html" class="hover:text-gray-900">Dépôt d'offre</a>
        <a href="admin.html" class="hover:text-gray-900">Administration</a>
      </div>
    </div>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
