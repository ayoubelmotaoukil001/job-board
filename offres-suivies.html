<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Offres Suivies — Stages & Alternances</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-full flex flex-col justify-between text-gray-900 bg-gray-50 antialiased font-['Inter']">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-lg text-gray-900">Stages & Alternances</a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
        <a href="index.html" class="text-gray-600 hover:text-gray-900">Offres</a>
        <a href="offres-suivies.html" class="text-gray-900 border-b-2 border-gray-900 pb-0.5">Offres Suivies</a>
        <a href="deposer-offre.html" class="text-gray-600 hover:text-gray-900">Publier une offre</a>
      </nav>
      <a href="admin.html" class="bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm">Espace Admin</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-6">

    <!-- Page Header -->
    <div class="flex items-center justify-between border-b border-gray-200 pb-4">
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Mes Offres Suivies</h1>
        <span id="followed-count" class="bg-gray-100 text-gray-800 text-xs font-bold px-2.5 py-0.5 rounded-full border border-gray-200">(0)</span>
      </div>
      <a href="index.html" class="text-xs font-medium text-gray-600 hover:text-gray-900">&larr; Explorer les offres</a>
    </div>

    <!-- Table Card -->
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase">
              <th scope="col" class="py-3.5 px-5">Poste</th>
              <th scope="col" class="py-3.5 px-5">Entreprise</th>
              <th scope="col" class="py-3.5 px-5">Type</th>
              <th scope="col" class="py-3.5 px-5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="followed-list" class="divide-y divide-gray-100 text-sm">
            <tr>
              <td colspan="4" class="py-8 text-center text-gray-500 text-xs">Chargement...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-12">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-3">
      <p>© 2026 Stages & Alternances</p>
      <div class="flex gap-4">
        <a href="index.html" class="hover:text-gray-900">Catalogue</a>
        <a href="offres-suivies.html" class="hover:text-gray-900">Offres suivies</a>
        <a href="deposer-offre.html" class="hover:text-gray-900">Dépôt d'offre</a>
        <a href="admin.html" class="hover:text-gray-900">Administration</a>
      </div>
    </div>
  </footer>

  <script type="module">
    import { fetchOffers } from './js/data.js';
    import { getFollowedOffers, removeFollowedOffer } from './js/storage.js';

    async function renderFollowedOffers() {
      const tbody = document.getElementById('followed-list');
      const countEl = document.getElementById('followed-count');
      const followedIds = getFollowedOffers();

      countEl.textContent = `(${followedIds.length})`;

      if (followedIds.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-12 text-center text-gray-500 text-xs">
              Vous ne suivez aucune offre pour le moment.
              <br><a href="index.html" class="text-indigo-600 font-semibold hover:underline mt-1 inline-block">Découvrir les opportunités &rarr;</a>
            </td>
          </tr>
        `;
        return;
      }

      try {
        const allOffers = await fetchOffers();
        const followedOffers = allOffers.filter(o => followedIds.includes(o.id));

        tbody.innerHTML = followedOffers.map(offer => {
          const isStage = offer.typeContrat?.toLowerCase() === 'stage';
          return `
            <tr class="hover:bg-gray-50/50">
              <td class="py-3.5 px-5 font-semibold text-gray-900">
                <a href="offre-detail.html?id=${offer.id}" class="hover:underline">${offer.titre}</a>
              </td>
              <td class="py-3.5 px-5 text-gray-600">${offer.entreprise} (${offer.ville})</td>
              <td class="py-3.5 px-5">
                <span class="${isStage ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-indigo-50 text-indigo-700 border-indigo-200'} border text-xs font-semibold px-2 py-0.5 rounded-full uppercase">
                  ${offer.typeContrat}
                </span>
              </td>
              <td class="py-3.5 px-5 text-right">
                <button type="button" data-id="${offer.id}" class="btn-remove-follow text-xs font-medium text-red-600 hover:text-red-800 border border-red-200 hover:bg-red-50 px-3 py-1 rounded-lg transition">
                  Retirer
                </button>
              </td>
            </tr>
          `;
        }).join('');

        document.querySelectorAll('.btn-remove-follow').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = Number(e.target.dataset.id);
            removeFollowedOffer(id);
            renderFollowedOffers();
          });
        });

      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" class="py-8 text-center text-rose-600 text-xs">Erreur lors de la récupération des offres.</td></tr>';
      }
    }

    renderFollowedOffers();
  </script>
</body>
</html>
